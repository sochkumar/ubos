# ─── UBOS web (nginx) ────────────────────────────────────────────────────
# Serves the built React SPA and proxies /api/* to the backend container.

upstream ubos_backend {
    # `backend` is the service name in docker-compose.yml
    server backend:8001;
    keepalive 32;
}

server {
    listen       80;
    server_name  _;

    # Uploads can be up to 25 MB (matches backend MAX_UPLOAD_SIZE_BYTES default).
    client_max_body_size 30m;

    # Gzip: help the shell + JSON payloads compress.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml font/ttf font/otf;
    gzip_min_length 512;
    gzip_vary on;

    root  /usr/share/nginx/html;
    index index.html;

    # ─── API proxy ───────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://ubos_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ─── Static asset caching ────────────────────────────────────────────
    # CRA emits content-hashed filenames under /static/*, so we can cache
    # aggressively and let index.html rev the pointers.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sw.js {
        # Service worker MUST NOT be cached — otherwise updates can't roll out.
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # ─── SPA fallback ────────────────────────────────────────────────────
    # Every non-API, non-static path returns index.html so React Router can
    # handle client-side routes like /records/:id, /s/:token, etc.
    location / {
        # index.html itself should never be cached long-term.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
