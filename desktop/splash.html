<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0d9488; color: #fff;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        user-select: none;
      }
      .logo {
        width: 64px; height: 64px; border-radius: 16px; background: rgba(255,255,255,.15);
        display: flex; align-items: center; justify-content: center; margin-bottom: 18px;
      }
      .cyl { width: 30px; height: 38px; position: relative; }
      .cyl b { position: absolute; left: 0; right: 0; height: 10px; border: 3px solid #fff; border-radius: 50%; }
      .cyl .t { top: 0; background: #fff; }
      .cyl .m { top: 14px; }
      .cyl .bd { position: absolute; top: 5px; left: 0; right: 0; bottom: 5px; background: #fff; }
      h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .5px; }
      p { margin: 6px 0 22px; font-size: 13px; opacity: .85; }
      .bar { width: 180px; height: 3px; background: rgba(255,255,255,.25); border-radius: 3px; overflow: hidden; }
      .bar span {
        display: block; width: 40%; height: 100%; background: #fff; border-radius: 3px;
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
    </style>
  </head>
  <body>
    <div class="logo">
      <div class="cyl"><span class="bd"></span><b class="t"></b><b class="m"></b></div>
    </div>
    <h1>UBOS</h1>
    <p>Starting your workspace…</p>
    <div class="bar"><span></span></div>
  </body>
</html>
