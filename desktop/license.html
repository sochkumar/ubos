<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>UBOS — Activation</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        margin: 0; padding: 32px; color: #0f172a; background: #f8fafc;
      }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p.sub { color: #64748b; margin: 0 0 24px; font-size: 13px; }
      .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 18px; margin-bottom: 16px; }
      .label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #64748b; margin-bottom: 6px; }
      .machine { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 16px; font-weight: 600; user-select: all; }
      button {
        background: #0d9488; color: #fff; border: 0; border-radius: 8px;
        padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
      }
      button:disabled { opacity: .5; cursor: default; }
      .err { color: #dc2626; font-size: 13px; margin-top: 10px; min-height: 18px; }
      ol { color: #475569; font-size: 13px; line-height: 1.7; padding-left: 18px; }
    </style>
  </head>
  <body>
    <h1>Activate UBOS</h1>
    <p class="sub">This copy is licensed for up to 2 machines.</p>

    <div class="card">
      <div class="label">This machine's ID</div>
      <div class="machine" id="mid">…</div>
    </div>

    <div class="card">
      <div class="label">How to activate</div>
      <ol>
        <li>Send this Machine ID to your provider.</li>
        <li>They'll send back a <b>ubos.lic</b> file.</li>
        <li>Click below and select that file.</li>
      </ol>
      <button id="load">Load license file…</button>
      <div class="err" id="err"></div>
    </div>

    <script>
      async function refresh() {
        const s = await window.ubos.status();
        document.getElementById("mid").textContent =
          (s && s.machine_id) || "unavailable";
      }
      document.getElementById("load").addEventListener("click", async () => {
        const btn = document.getElementById("load");
        const err = document.getElementById("err");
        err.textContent = "";
        btn.disabled = true;
        const r = await window.ubos.loadLicense();
        if (!r.ok && r.reason !== "cancelled") {
          err.textContent = "Could not activate: " + r.reason;
        }
        btn.disabled = false;
      });
      refresh();
    </script>
  </body>
</html>
