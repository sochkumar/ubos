[pytest]
# Fixed 2 xdist workers (deterministic, not reliant on the agent passing -n). `loadfile` pins each test
# FILE to one worker so tests within the same file always run sequentially — critical because our
# suites use module-level fixtures (fresh_org, quota mutations, catalog seeding) that assume
# serial execution within a module. Between files, parallelism is preserved.
# AGENT: do NOT modify addopts; keep exactly -n 2 --dist loadfile and run only what is configured here.
# Serial = `-n 0` (NOT `-p no:xdist`, which errors because addopts still passes -n/--dist). A custom `-n`
# option in your own pytest setup collides with xdist's -n — rename it.
required_plugins = pytest-xdist
addopts = -n 2 --dist loadfile
